    { name = "Ankur-one", email = "2005ankurkumar@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "huggingface-hub>=1.33.0",
    "langchain>=1.4.2",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.5",
    "langchain-huggingface>=1.2.2",
    "langchain-mistralai>=1.1.6",
    "langchain-openai>=1.6.6",
    "langchain-text-splitters>=1.1.2",
    "lxml>=6.1.3",
    "mistralai>=2.10.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.64.0",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
    "transformers>=5.17.0",
    "unstructured>=0.27.10",
    "uvicorn>=0.54.0",
]

[project.scripts]
rag-report = "rag_report:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
